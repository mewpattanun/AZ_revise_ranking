name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/celllinefinder

            # Pull latest code. reset --hard (not pull) so files the build
            # rewrites on the server (frontend/dist/index.html,
            # package-lock.json) can never block the update. Untracked
            # files (data, .env, venv, node_modules) are not touched.
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Backend: install any new dependencies
            source backend_api/venv/bin/activate
            pip install -r requirements.txt --quiet
            deactivate

            # Frontend: install deps + rebuild
            cd frontend
            npm install
            npm run build
            cd ..

            # Restart backend service
            sudo systemctl restart celllinefinder

            # Verify
            sleep 10
            curl -sf http://localhost:8000/health || echo "WARNING: Backend health check failed"
            echo "Deployment complete!"
